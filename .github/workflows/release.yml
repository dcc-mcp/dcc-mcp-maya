name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for manual build-mod (e.g. v0.2.4). Leave empty to only run release-please."
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}${{ inputs.tag_name && format('-{0}', inputs.tag_name) || '' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  # ── Release Please — creates/updates the release PR ────────────────────────
  release-please:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || inputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # Use a PAT (RELEASE_PLEASE_TOKEN) to trigger CI workflows on
          # the created PR. With GITHUB_TOKEN, GitHub blocks both
          # pull_request and pull_request_target events, so release-please
          # PRs would have no CI status checks.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.PERSONAL_ACCESS_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ── Build wheel — only when release-please creates a release ───────────────
  build:
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    runs-on: ubuntu-latest
    env:
      # Release gate must run the same hermetic test contract as ci.yml. Job
      # persistence takes a machine-wide exclusive SQLite lease per process,
      # so two in-process MayaMcpServer instances collide and every later
      # start fails with "job persistence unavailable (ownership)" — that is
      # what broke the v0.9.27 / v0.9.28 releases. Tests never need persisted
      # job history.
      DCC_MCP_DISABLE_JOB_PERSISTENCE: "1"
      DCC_MCP_MAYA_JOB_STORAGE: ""
      DCC_MCP_ALLOW_AMBIENT_PYTHON: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          # 3.12 is the newest interpreter declared in pyproject classifiers.
          python-version: "3.12"

      - name: Install build tools
        run: pip install hatchling build

      - name: Run tests
        run: |
          pip install ".[dev]"
          pytest tests/ \
            --ignore=tests/e2e \
            --ignore=tests/e2e_standalone \
            -v --tb=short

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify dist artifacts
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          dist = Path("dist")
          wheels = sorted(dist.glob("*.whl"))
          sdists = sorted(dist.glob("*.tar.gz"))
          if not wheels or not sdists:
              print("::error::dist/ is missing a wheel or an sdist")
              for path in sorted(dist.iterdir()):
                  print("dist entry:", path.name)
              sys.exit(1)
          for path in wheels + sdists:
              print("built:", path.name)
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # ── Publish to PyPI ─────────────────────────────────────────────────────────
  publish:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dcc-mcp-maya
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: List dist
        run: ls -la dist/

      - name: Publish to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          print-hash: true

  # ── Build Maya .mod module ZIPs ──────────────────────────────────────────────
  build-mod:
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    strategy:
      matrix:
        include:
          - platform: win64
            runs-on: windows-latest
          - platform: linux
            runs-on: ubuntu-latest
          - platform: macos
            runs-on: macos-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install assemble dependencies
        run: pip install dcc-mcp-core "packaging>=21.3"

      - name: Assemble .mod module
        run: |
          # Use release-please version or strip 'v' from manual tag_name input
          VERSION="${{ needs.release-please.outputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${{ inputs.tag_name }}"
            VERSION="${VERSION#v}"  # strip leading 'v'
          fi
          python packaging/assemble_mod.py \
            --version "$VERSION" \
            --platform ${{ matrix.platform }} \
            --output dist/mod \
            --project-root .
        shell: bash

      - name: Upload mod artifact
        uses: actions/upload-artifact@v7
        with:
          name: mod-${{ matrix.platform }}
          path: dist/mod/**/*.zip

  # ── Attach wheels to GitHub Release ─────────────────────────────────────────
  attach-release-assets:
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Attach wheels to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: dist/*

  # ── Fail loudly when a release ships without wheel / sdist ─────────────────
  # ``publish`` and ``attach-release-assets`` are skipped when an upstream job
  # fails, which silently produced two releases with mod ZIPs only. This job
  # turns that silent gap into a red check on the release run.
  verify-release-assets:
    needs: [release-please, attach-release-assets]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Verify wheel and sdist are attached to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail

          assets="$(gh release view "$TAG_NAME" --json assets --jq '.assets[].name')"
          echo "Release assets for $TAG_NAME:"
          echo "$assets"

          wheel="$(echo "$assets" | grep -E '^dcc_mcp_maya-.+-py3-none-any\.whl$' || true)"
          sdist="$(echo "$assets" | grep -E '^dcc_mcp_maya-.+\.tar\.gz$' || true)"

          missing=""
          if [ -z "$wheel" ]; then missing="wheel"; fi
          if [ -z "$sdist" ]; then
            if [ -n "$missing" ]; then missing="$missing, sdist"; else missing="sdist"; fi
          fi

          if [ -n "$missing" ]; then
            echo "::error::release $TAG_NAME is missing: $missing — PyPI publish or asset attach did not happen"
            exit 1
          fi

          echo "wheel and sdist present on $TAG_NAME"

  # ── Attach .mod module ZIPs to GitHub Release ───────────────────────────────
  attach-mod-release:
    needs: [release-please, build-mod]
    if: needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all mod artifacts
        uses: actions/download-artifact@v8
        with:
          path: mod-artifacts/
          pattern: mod-*

      - name: List mod artifacts
        run: find mod-artifacts/ -name "*.zip" -ls

      - name: Attach mod ZIPs to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name || inputs.tag_name }}
          files: mod-artifacts/**/*.zip
