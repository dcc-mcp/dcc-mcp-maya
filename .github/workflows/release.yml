name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for manual build-mod (e.g. v0.2.4). Leave empty to only run release-please."
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}${{ inputs.tag_name && format('-{0}', inputs.tag_name) || '' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  # ── Release Please — creates/updates the release PR ────────────────────────
  release-please:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || inputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # Use a PAT (RELEASE_PLEASE_TOKEN) to trigger CI workflows on
          # the created PR. With GITHUB_TOKEN, GitHub blocks both
          # pull_request and pull_request_target events, so release-please
          # PRs would have no CI status checks.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.PERSONAL_ACCESS_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ── Build wheel — only when release-please creates a release ───────────────
  build:
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    runs-on: ubuntu-latest
    env:
      # dcc-mcp-core 0.20.x gives every server created inside ONE process the
      # same default SQLite job DB (<log_dir>/dcc-mcp-maya-<pid>-jobs.db) and
      # holds an exclusive file lease on it from start() until stop(). Any test
      # that leaves a server running therefore makes every later
      # MayaMcpServer() fail closed with
      #   "job persistence unavailable (ownership); refusing to start with
      #    in-memory history"
      # which failed this job for v0.9.27 and v0.9.28 and silently skipped
      # `publish` + `attach-release-assets`.
      #
      # Job persistence itself is covered by ci.yml; this job only needs the
      # suite green so the wheel/sdist can be built and published. Both
      # variables are set so the gate matches ci.yml exactly:
      # ``DCC_MCP_DISABLE_JOB_PERSISTENCE`` is read by dcc-mcp-core, while
      # ``DCC_MCP_MAYA_JOB_STORAGE`` is the one the adapter's
      # ``resolve_job_storage()`` honours.
      DCC_MCP_ALLOW_AMBIENT_PYTHON: "1"
      DCC_MCP_DISABLE_JOB_PERSISTENCE: "1"
      DCC_MCP_MAYA_JOB_STORAGE: ""
    steps:
      # Manual backfills must build the tagged source. Without ``ref`` the
      # dispatch branch (main by default) is built instead, so a backfill
      # could publish another version's artifacts under the requested tag.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.sha }}
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          # 3.12 is the newest interpreter declared by the wheel classifiers.
          python-version: "3.12"

      - name: Install build tools
        run: pip install hatchling build

      - name: Run tests
        run: |
          pip install -e ".[dev]"
          pytest tests/ \
            --ignore=tests/e2e \
            --ignore=tests/e2e_standalone \
            -v --tb=short

      - name: Build wheel and sdist
        run: python -m build

      # Guard rail: `publish` must never be fed an empty dist/ again. The
      # v0.9.27/v0.9.28 releases looked "green" while shipping no wheel/sdist.
      - name: Verify wheel and sdist were produced
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          ls -la dist/
          if [ ${#wheels[@]} -eq 0 ] || [ ${#sdists[@]} -eq 0 ]; then
            echo "::error::python -m build produced no wheel and/or sdist; refusing to report a passing release gate"
            exit 1
          fi
          echo "OK: ${#wheels[@]} wheel(s), ${#sdists[@]} sdist(s)"

      # Second guard rail: PyPI uploads cannot be overwritten or deleted, so
      # the artifacts must belong to the tag `publish` is about to target.
      - name: Verify dist matches the requested tag
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
          TAG_NAME: ${{ inputs.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          # Same precedence as the checkout ``ref``: a manual backfill builds
          # the requested tag, so it must also be validated against that tag.
          version = ""
          if os.environ.get("EVENT_NAME") == "workflow_dispatch":
              version = (os.environ.get("TAG_NAME") or "").strip().lstrip("vV")
          if not version:
              version = (os.environ.get("RELEASE_VERSION") or "").strip()
          if not version:
              print("No release version resolved; skipping the tag/artifact check")
              sys.exit(0)

          artifacts = sorted(Path("dist").glob("*.whl")) + sorted(Path("dist").glob("*.tar.gz"))
          # Anchor on the separator that follows the version: a bare prefix
          # would let "0.9.2" accept "dcc_mcp_maya-0.9.28-...".
          expected = ("dcc_mcp_maya-%s-" % version, "dcc_mcp_maya-%s." % version)
          mismatched = [path.name for path in artifacts if not path.name.startswith(expected)]
          if mismatched:
              print("::error::dist artifacts do not match version %s: %s" % (version, ", ".join(mismatched)))
              sys.exit(1)
          print("OK: %d artifact(s) match version %s" % (len(artifacts), version))
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # ── Publish to PyPI ─────────────────────────────────────────────────────────
  publish:
    needs: [release-please, build]
    # A manual re-run (workflow_dispatch with tag_name) must be able to publish,
    # otherwise a release whose `build` job failed can never be back-filled to
    # PyPI — v0.9.27/v0.9.28 were stuck exactly there.
    if: needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dcc-mcp-maya
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: List dist
        run: ls -la dist/

      - name: Publish to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          print-hash: true

  # ── Build Maya .mod module ZIPs ──────────────────────────────────────────────
  build-mod:
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    strategy:
      matrix:
        include:
          - platform: win64
            runs-on: windows-latest
          - platform: linux
            runs-on: ubuntu-latest
          - platform: macos
            runs-on: macos-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      # Same backfill rule as the build job: the .mod ZIPs must be assembled
      # from the requested tag, not from whatever main points at.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.sha }}
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install assemble dependencies
        run: pip install dcc-mcp-core "packaging>=21.3"

      - name: Assemble .mod module
        run: |
          # Use release-please version or strip 'v' from manual tag_name input
          VERSION="${{ needs.release-please.outputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${{ inputs.tag_name }}"
            VERSION="${VERSION#v}"  # strip leading 'v'
          fi
          python packaging/assemble_mod.py \
            --version "$VERSION" \
            --platform ${{ matrix.platform }} \
            --output dist/mod \
            --project-root .
        shell: bash

      - name: Upload mod artifact
        uses: actions/upload-artifact@v7
        with:
          name: mod-${{ matrix.platform }}
          path: dist/mod/**/*.zip

  # ── Attach wheels to GitHub Release ─────────────────────────────────────────
  attach-release-assets:
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Attach wheels to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: dist/*

  # ── Attach .mod module ZIPs to GitHub Release ───────────────────────────────
  attach-mod-release:
    needs: [release-please, build-mod]
    if: needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all mod artifacts
        uses: actions/download-artifact@v8
        with:
          path: mod-artifacts/
          pattern: mod-*

      - name: List mod artifacts
        run: find mod-artifacts/ -name "*.zip" -ls

      - name: Attach mod ZIPs to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name || inputs.tag_name }}
          files: mod-artifacts/**/*.zip

  # ── Alarm — a release without wheel/sdist is NOT a shipped release ─────────
  verify-release-assets:
    needs: [release-please, publish, attach-release-assets]
    # `always()` so the alarm also fires when `publish`/`attach-release-assets`
    # were skipped — that is precisely the v0.9.27/v0.9.28 failure mode.
    if: always() && (needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag_name != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: read  # read-only: this job only inspects release assets

    steps:
      - name: Assert the release carries a wheel and an sdist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name || inputs.tag_name }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name] | join("\n")')"
          echo "Assets on $TAG_NAME:"
          echo "$assets"

          missing=0
          if ! echo "$assets" | grep -q '\.whl$'; then
            echo "::error::$TAG_NAME has no .whl attached"
            missing=1
          fi
          if ! echo "$assets" | grep -q '\.tar\.gz$'; then
            echo "::error::$TAG_NAME has no sdist (.tar.gz) attached"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo "::error::Release $TAG_NAME shipped without wheel/sdist - pip install -U dcc-mcp-maya will not pick it up. See the build and publish jobs above."
            exit 1
          fi
          echo "OK: $TAG_NAME carries a wheel and an sdist"
