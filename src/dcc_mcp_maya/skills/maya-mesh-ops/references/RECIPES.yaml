recipes:
  - name: loft_hull_from_sections
    dcc: maya
    description: Build a polygon hull from an ordered set of named NURBS cross-sections.
    inputs_schema:
      type: object
      additionalProperties: false
      required:
        - sections
        - name
      properties:
        sections:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 2
          maxItems: 64
        name:
          type: string
          minLength: 1
    steps:
      - tool: maya_mesh_ops__loft_sections
        arguments:
          sections: ${sections}
          name: ${name}
    output_contract:
      type: object
      required:
        - object_name
        - object_uuid
        - shape
        - shape_uuid
        - input_sections
        - history_uuid
      properties:
        object_name:
          type: string
        object_uuid:
          type: string
        shape:
          type: string
        shape_uuid:
          type: string
        input_sections:
          type: array
          items:
            type: string
          minItems: 2
        history_uuid:
          type: string

  - name: mirror_assembly
    dcc: maya
    description: Mirror one polygon assembly in place across a world axis; this mutates the named mesh and does not create or preserve a separate original.
    inputs_schema:
      type: object
      additionalProperties: false
      required:
        - object_name
        - axis
      properties:
        object_name:
          type: string
          minLength: 1
        axis:
          type: string
          enum:
            - x
            - y
            - z
    steps:
      - tool: maya_mesh_ops__mirror_mesh
        arguments:
          object_name: ${object_name}
          axis: ${axis}
    output_contract:
      type: object
      required:
        - object_name
        - axis
        - faces_before
        - faces_after
      properties:
        object_name:
          type: string
        axis:
          type: string
          enum:
            - x
            - y
            - z
        cut_position:
          type: number
        faces_before:
          type: integer
          minimum: 0
        faces_after:
          type: integer
          minimum: 1

  - name: radial_array
    dcc: maya
    description: Place a source pivot, then build a bounded rotational instance array around it.
    inputs_schema:
      type: object
      additionalProperties: false
      required:
        - object_name
        - count
        - pivot
        - rotate_step
        - name_prefix
      properties:
        object_name:
          type: string
          minLength: 1
        count:
          type: integer
          minimum: 2
          maximum: 128
        pivot:
          type: array
          items:
            type: number
          minItems: 3
          maxItems: 3
        rotate_step:
          type: array
          items:
            type: number
          minItems: 3
          maxItems: 3
        name_prefix:
          type: string
          minLength: 1
    steps:
      - tool: maya_mesh_ops__set_pivot
        arguments:
          object_name: ${object_name}
          position: ${pivot}
          space: world
      - tool: maya_mesh_ops__array_instances
        arguments:
          object_name: ${object_name}
          count: ${count}
          rotate_step: ${rotate_step}
          name_prefix: ${name_prefix}
    output_contract:
      type: object
      required:
        - source
        - source_uuid
        - objects
        - object_uuids
        - verified_count
      properties:
        source:
          type: string
        source_uuid:
          type: string
        objects:
          type: array
          items:
            type: string
          minItems: 2
          maxItems: 128
        object_uuids:
          type: array
          items:
            type: string
          minItems: 2
          maxItems: 128
        verified_count:
          type: integer
          minimum: 2
          maximum: 128

  - name: auto_uv_for_export
    dcc: maya
    description: Automatically project and verify UVs for one export mesh; apply once to every mesh in the export set.
    inputs_schema:
      type: object
      additionalProperties: false
      required:
        - object_name
        - planes
        - percentage_space
      properties:
        object_name:
          type: string
          minLength: 1
        planes:
          type: integer
          enum:
            - 4
            - 5
            - 6
            - 8
            - 12
          default: 6
        percentage_space:
          type: number
          minimum: 0
          maximum: 5
          default: 0.2
    steps:
      - tool: maya_uv_ops__auto_uv
        arguments:
          object_name: ${object_name}
          planes: ${planes}
          percentage_space: ${percentage_space}
    output_contract:
      type: object
      required:
        - object_name
        - uv_set
        - uv_count
        - uv_digest
        - changed
        - planes
      properties:
        object_name:
          type: string
        uv_set:
          type: string
        uv_count:
          type: integer
          minimum: 1
        uv_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
        changed:
          type: boolean
          const: true
        planes:
          type: integer
          enum:
            - 4
            - 5
            - 6
            - 8
            - 12
