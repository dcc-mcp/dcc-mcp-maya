tools:
- name: assign_texture
  description: Create and verify a bounded file/place2d texture network for one Arnold material slot.
  source_file: scripts/assign_texture.py
  execution: sync
  affinity: main
  annotations:
    read_only_hint: false
    destructive_hint: true
    idempotent_hint: false
    open_world_hint: false
  group: shading-lighting
  input_schema:
    type: object
    additionalProperties: false
    required:
    - material_name
    - texture_path
    - slot
    properties:
      material_name:
        type: string
        minLength: 1
        maxLength: 512
      texture_path:
        type: string
        minLength: 1
        maxLength: 4096
      slot:
        type: string
        enum:
        - base_color
        - roughness
        - normal
      color_space:
        type: string
        enum:
        - auto
        - sRGB
        - Raw
        default: auto
      udim_mode:
        type: string
        enum:
        - 'off'
        - udim
        default: 'off'
  output_schema:
    type: object
    additionalProperties: false
    required:
    - material
    - material_type
    - slot
    - destination_attr
    - texture_node
    - place2d_node
    - utility_node
    - texture_path
    - color_space
    - udim_mode
    - tile_count
    - verified
    properties:
      material:
        type: string
      material_type:
        type: string
        const: aiStandardSurface
      slot:
        type: string
        enum:
        - base_color
        - roughness
        - normal
      destination_attr:
        type: string
      texture_node:
        type: string
      place2d_node:
        type: string
      utility_node:
        type:
        - string
        - 'null'
      texture_path:
        type: string
      color_space:
        type: string
      udim_mode:
        type: string
        enum:
        - 'off'
        - udim
      tile_count:
        type: integer
        minimum: 1
        maximum: 256
      verified:
        type: boolean
        const: true
- name: delete_material_preset
  description: Delete a material preset in the current Maya scene.
  execution: sync
  affinity: main
  annotations:
    destructive_hint: true
    idempotent_hint: true
  group: shading-lighting
  input_schema:
    type: object
    properties:
      file_path:
        type: string
    required:
    - file_path
- name: list_material_presets
  description: List reusable material preset JSON files from a material library directory
    without touching the Maya scene.
  execution: sync
  affinity: main
  annotations:
    read_only_hint: true
    idempotent_hint: true
  group: shading-lighting
  input_schema:
    type: object
    properties:
      library_dir:
        type: string
    required:
    - library_dir
- name: load_material
  description: Load a material in the current Maya scene.
  execution: sync
  affinity: main
  group: shading-lighting
  input_schema:
    type: object
    properties:
      file_path:
        type: string
      material_name:
        type: string
      assign_to:
        oneOf:
        - type: string
        - type: array
          items:
            type: string
          minItems: 1
    required:
    - file_path
- name: reload_textures
  description: Reissue explicit Maya file-node paths and report bounded disk evidence for regenerated maps.
  source_file: scripts/reload_textures.py
  execution: sync
  affinity: main
  annotations:
    read_only_hint: false
    destructive_hint: false
    idempotent_hint: true
    open_world_hint: false
  group: shading-lighting
  input_schema:
    type: object
    additionalProperties: false
    required:
    - texture_nodes
    properties:
      texture_nodes:
        type: array
        minItems: 1
        maxItems: 64
        uniqueItems: true
        items:
          type: string
          minLength: 1
          maxLength: 512
  output_schema:
    type: object
    additionalProperties: false
    required:
    - textures
    - reloaded_count
    - verified
    properties:
      textures:
        type: array
        minItems: 1
        maxItems: 64
        items:
          type: object
          additionalProperties: false
          required:
          - node
          - texture_path
          - udim_mode
          - tile_count
          - bytes
          - mtime_ns
          properties:
            node:
              type: string
            texture_path:
              type: string
            udim_mode:
              type: string
              enum:
              - 'off'
              - udim
            tile_count:
              type: integer
              minimum: 1
              maximum: 256
            bytes:
              type: integer
              minimum: 0
            mtime_ns:
              type: integer
              minimum: 0
      reloaded_count:
        type: integer
        minimum: 1
        maximum: 64
      verified:
        type: boolean
        const: true
- name: repath_textures
  description: Transactionally move explicit Maya file-node paths between existing roots.
  source_file: scripts/repath_textures.py
  execution: sync
  affinity: main
  annotations:
    read_only_hint: false
    destructive_hint: true
    idempotent_hint: false
    open_world_hint: false
  group: shading-lighting
  input_schema:
    type: object
    additionalProperties: false
    required:
    - texture_nodes
    - old_root
    - new_root
    properties:
      texture_nodes:
        type: array
        minItems: 1
        maxItems: 64
        uniqueItems: true
        items:
          type: string
          minLength: 1
          maxLength: 512
      old_root:
        type: string
        minLength: 1
        maxLength: 4096
      new_root:
        type: string
        minLength: 1
        maxLength: 4096
  output_schema:
    type: object
    additionalProperties: false
    required:
    - old_root
    - new_root
    - changes
    - changed_count
    - verified
    properties:
      old_root:
        type: string
      new_root:
        type: string
      changes:
        type: array
        minItems: 1
        maxItems: 64
        items:
          type: object
          additionalProperties: false
          required:
          - node
          - previous_path
          - texture_path
          - udim_mode
          - tile_count
          properties:
            node:
              type: string
            previous_path:
              type: string
            texture_path:
              type: string
            udim_mode:
              type: string
              enum:
              - 'off'
              - udim
            tile_count:
              type: integer
              minimum: 1
              maximum: 256
      changed_count:
        type: integer
        minimum: 1
        maximum: 64
      verified:
        type: boolean
        const: true
- name: save_material
  description: Save a material in the current Maya scene.
  execution: sync
  affinity: main
  group: shading-lighting
  input_schema:
    type: object
    properties:
      material:
        type: string
      library_dir:
        type: string
      preset_name:
        type: string
      attributes:
        oneOf:
        - type: string
        - type: array
          items:
            type: string
          minItems: 1
      overwrite:
        type: boolean
        default: true
    required:
    - material
    - library_dir
