tools:
- name: configure_color_management
  description: Configure Maya with an OCIO config, rendering space, display/view pair,
    and renderer output transform.
  execution: async
  affinity: main
  timeout_hint_secs: 600
  annotations:
    read_only_hint: false
    destructive_hint: false
    idempotent_hint: true
    open_world_hint: false
  group: rendering
  input_schema:
    type: object
    additionalProperties: false
    required:
    - config_file_path
    properties:
      config_file_path:
        type: string
        minLength: 1
        maxLength: 4096
        description: Absolute path to an existing OCIO config file.
      rendering_space_name:
        type: string
        minLength: 1
        maxLength: 256
        default: ACEScg
      display_name:
        type: string
        minLength: 1
        maxLength: 256
        default: Rec.1886 Rec.709 - Display
      view_name:
        type: string
        minLength: 1
        maxLength: 256
        default: ACES 1.0 - SDR Video
      apply_output_transform:
        type: boolean
        default: true
  output_schema:
    type: object
    additionalProperties: false
    required:
    - config_file_path
    - rendering_space_name
    - display_name
    - view_name
    - ocio_v2_enabled
    - output_transform_enabled
    - input_color_spaces
    - rendering_spaces
    - output_transforms
    properties:
      config_file_path:
        type: string
      rendering_space_name:
        type: string
      display_name:
        type: string
      view_name:
        type: string
      ocio_v2_enabled:
        type: boolean
      output_transform_enabled:
        type: boolean
      input_color_spaces:
        type: array
        maxItems: 512
        items:
          type: string
          maxLength: 256
      rendering_spaces:
        type: array
        maxItems: 512
        items:
          type: string
          maxLength: 256
      output_transforms:
        type: array
        maxItems: 512
        items:
          type: string
          maxLength: 256
- name: setup_hdr_arnold
  description: Load MtoA and create an Arnold HDR skydome environment for look-development
    rendering.
  execution: async
  affinity: main
  timeout_hint_secs: 600
  annotations:
    read_only_hint: false
    destructive_hint: false
    idempotent_hint: false
    open_world_hint: false
  group: rendering
  input_schema:
    type: object
    required:
    - hdri_path
    properties:
      hdri_path:
        type: string
        minLength: 1
      name:
        type: string
      intensity:
        type: number
        default: 1.0
      rotation:
        type: number
        default: 0.0
      visible_in_diffuse:
        type: boolean
        default: true
      visible_in_specular:
        type: boolean
        default: true
      set_renderer:
        type: boolean
        default: true
      exposure:
        type: number
        default: 0.0
- name: capture_playblast_sequence
  description: Capture a playblast image sequence to disk and return paths plus camera
    metadata.
  execution: async
  affinity: main
  timeout_hint_secs: 600
  annotations:
    read_only_hint: false
    destructive_hint: false
    idempotent_hint: false
    open_world_hint: false
  group: rendering
  input_schema:
    type: object
    properties:
      output_dir:
        type: string
        description: Optional output directory; a temporary directory is created when
          omitted.
      prefix:
        type: string
        default: mcp_playblast
      start_frame:
        type: number
      end_frame:
        type: number
      width:
        type: integer
        minimum: 1
        maximum: 8192
        default: 1920
      height:
        type: integer
        minimum: 1
        maximum: 8192
        default: 1080
      percent:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
      compression:
        type: string
        enum:
        - png
        - jpg
        - jpeg
        default: png
      off_screen:
        type: boolean
      show_ornaments:
        type: boolean
        default: false
      view_fit:
        type: boolean
        default: false
      camera:
        type: string
      include_camera_metadata:
        type: boolean
        default: true
- name: capture_viewport
  description: Capture the active Maya viewport as a base64 PNG. Off-screen rendering
    auto-enables when Maya is minimized or in batch mode.
  execution: async
  affinity: main
  timeout_hint_secs: 600
  annotations:
    read_only_hint: false
    destructive_hint: false
    idempotent_hint: false
    open_world_hint: false
  group: rendering
  input_schema:
    type: object
    properties:
      width:
        type: integer
        minimum: 1
        maximum: 8192
        default: 1920
      height:
        type: integer
        minimum: 1
        maximum: 8192
        default: 1080
      frame:
        type: number
        description: Frame to capture; defaults to current frame.
      off_screen:
        type: boolean
        description: Force off-screen capture. Auto-enabled in batch mode and when no
          model panel is visible.
      view_fit:
        type: boolean
        default: false
        description: When true, runs cmds.viewFit(allObjects=True, animate=False) on
          the active model panel before capture. Prefer this over raw viewFit in execute_python.
- name: debug_scene_snapshot
  description: Collect a compact scene debug snapshot with DAG summary, optional render_frame
    preview, and optional full Maya UI capture.
  execution: async
  affinity: main
  timeout_hint_secs: 600
  annotations:
    read_only_hint: true
    destructive_hint: false
    idempotent_hint: false
    open_world_hint: false
  group: rendering
  input_schema:
    type: object
    properties:
      max_nodes:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
      include_preview:
        type: boolean
        default: true
      include_ui:
        type: boolean
        default: false
      camera:
        type: string
      frame:
        type: number
      preview_width:
        type: integer
        minimum: 1
        maximum: 8192
        default: 640
      preview_height:
        type: integer
        minimum: 1
        maximum: 8192
        default: 480
      return_base64:
        type: boolean
        default: true
      ui_object_name:
        type: string
        description: Optional Qt objectName/windowTitle for the UI capture.
- name: get_render_settings
  description: Query current render settings (resolution, renderer, frame range, format,
    output path).
  execution: sync
  affinity: main
  annotations:
    read_only_hint: true
    idempotent_hint: true
  group: rendering
  input_schema:
    type: object
    properties: {}
- name: get_scene_render_stats
  description: Get scene render statistics including quality attributes without modifying
    the Maya scene.
  execution: sync
  affinity: main
  annotations:
    read_only_hint: true
    idempotent_hint: true
  group: rendering
  input_schema:
    type: object
    properties: {}
- name: get_viewport_camera
  description: Query the active model panel camera with scene-camera fallback, returning
    camera transform, shape, focal length, and film aperture.
  execution: sync
  affinity: main
  annotations:
    read_only_hint: true
    idempotent_hint: true
  group: rendering
  input_schema:
    type: object
    properties: {}
- name: playblast
  description: Capture a viewport screenshot as a base64-encoded PNG via playblast (off-screen).
    Frame is passed as a proper Maya time range; width and height are clamped to reduce
    GPU OOM risk.
  execution: async
  affinity: main
  timeout_hint_secs: 600
  annotations:
    read_only_hint: false
    destructive_hint: false
    idempotent_hint: false
    open_world_hint: false
  group: rendering
  input_schema:
    type: object
    properties:
      width:
        type: integer
        minimum: 1
        maximum: 8192
        default: 1920
      height:
        type: integer
        minimum: 1
        maximum: 8192
        default: 1080
      frame:
        type: number
        description: Frame to capture; defaults to current frame.
      percent:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
- name: playblast_to_mp4
  description: Capture a playblast sequence and encode to MP4 with ffmpeg. Use for animation
    previews; requires ffmpeg on PATH.
  execution: async
  affinity: main
  timeout_hint_secs: 600
  annotations:
    read_only_hint: false
    destructive_hint: false
    idempotent_hint: false
    open_world_hint: false
  group: rendering
  input_schema:
    type: object
    properties:
      output_dir:
        type: string
      prefix:
        type: string
        default: mcp_playblast
      start_frame:
        type: number
      end_frame:
        type: number
      width:
        type: integer
        minimum: 1
        maximum: 8192
        default: 1920
      height:
        type: integer
        minimum: 1
        maximum: 8192
        default: 1080
      percent:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
      fps:
        type: integer
        minimum: 1
        maximum: 240
        default: 24
      off_screen:
        type: boolean
      show_ornaments:
        type: boolean
        default: false
      output_path:
        type: string
      keep_frames:
        type: boolean
        default: false
      overwrite:
        type: boolean
        default: true
- name: render_frame
  description: Render one frame to disk with the active renderer and optional base64
    output. Uses Arnold when available, falls back to cmds.render.
  execution: async
  affinity: main
  timeout_hint_secs: 600
  annotations:
    read_only_hint: false
    destructive_hint: false
    idempotent_hint: false
    open_world_hint: false
  group: rendering
  input_schema:
    type: object
    properties:
      camera:
        type: string
        description: Camera transform or shape to render. Defaults to the first renderable
          camera, then persp.
      frame:
        type: number
        description: Frame to render; defaults to current time.
      width:
        type: integer
        minimum: 1
        maximum: 8192
        description: Optional render width override.
      height:
        type: integer
        minimum: 1
        maximum: 8192
        description: Optional render height override.
      output_dir:
        type: string
        description: Directory for rendered output. Defaults to the workspace images
          rule or a temporary directory.
      output_name:
        type: string
        description: Output filename prefix; sanitized before use.
      return_base64:
        type: boolean
        default: true
        description: Include base64 image bytes in context.image_base64.
  output_schema:
    type: object
    required:
    - renderer
    - view_transform
    - camera
    - frame
    - width
    - height
    - path
    - output_path
    - output_size
    - log_summary
    properties:
      renderer:
        type: string
      view_transform:
        type: string
        minLength: 1
      camera:
        type: string
      frame:
        type: number
      width:
        type: integer
        minimum: 1
        maximum: 8192
      height:
        type: integer
        minimum: 1
        maximum: 8192
      path:
        type: string
      output_path:
        type: string
      output_size:
        type: integer
        minimum: 1
      log_summary:
        type: object
        additionalProperties: false
        required:
        - captured
        - reason
        properties:
          captured:
            type: boolean
            const: false
          reason:
            type: string
            const: renderer_log_not_captured
- name: render_sequence
  description: Render an inclusive frame range by reusing the active renderer's verified
    single-frame path.
  execution: async
  affinity: main
  timeout_hint_secs: 600
  annotations:
    read_only_hint: false
    destructive_hint: false
    idempotent_hint: false
    open_world_hint: false
  group: rendering
  input_schema:
    type: object
    required:
    - camera
    - output_dir
    properties:
      camera:
        type: string
      output_dir:
        type: string
      start_frame:
        type: integer
        default: 1
      end_frame:
        type: integer
        default: 360
      width:
        type: integer
        minimum: 1
        maximum: 8192
      height:
        type: integer
        minimum: 1
        maximum: 8192
      output_prefix:
        type: string
        default: maya_lookdev
- name: set_aov
  description: Add, list, or remove one bounded Arnold AOV and return exact native
    AOV readback.
  execution: sync
  affinity: main
  annotations:
    read_only_hint: false
    destructive_hint: true
    idempotent_hint: false
    open_world_hint: false
  group: rendering
  input_schema:
    type: object
    additionalProperties: false
    required:
    - action
    properties:
      action:
        type: string
        enum:
        - add
        - list
        - remove
      name:
        type: string
        minLength: 1
        maxLength: 64
        pattern: ^[A-Za-z][A-Za-z0-9_]*$
      data_type:
        type: string
        enum:
        - rgba
        - rgb
        - float
        - int
        - bool
        - vector
        - point
        - point2
        default: rgba
  output_schema:
    type: object
    additionalProperties: false
    required:
    - action
    - changed
    - aovs
    - count
    properties:
      action:
        type: string
        enum:
        - add
        - list
        - remove
      changed:
        type: boolean
      aov:
        $ref: '#/$defs/aov'
      removed:
        $ref: '#/$defs/aov'
      aovs:
        type: array
        maxItems: 64
        items:
          $ref: '#/$defs/aov'
      count:
        type: integer
        minimum: 0
        maximum: 64
    $defs:
      aov:
        type: object
        additionalProperties: false
        required:
        - name
        - node
        - data_type
        - enabled
        properties:
          name:
            type: string
          node:
            type: string
          data_type:
            type: string
            enum:
            - rgba
            - rgb
            - float
            - int
            - bool
            - vector
            - point
            - point2
          enabled:
            type: boolean
- name: set_exposure
  description: Set bounded Arnold exposure on one camera or light and verify the
    exact native aiExposure readback.
  execution: sync
  affinity: main
  annotations:
    read_only_hint: false
    destructive_hint: true
    idempotent_hint: true
    open_world_hint: false
  group: rendering
  input_schema:
    type: object
    additionalProperties: false
    required:
    - target
    - exposure
    properties:
      target:
        type: string
        minLength: 1
        maxLength: 512
      exposure:
        type: number
        minimum: -20.0
        maximum: 20.0
  output_schema:
    type: object
    additionalProperties: false
    required:
    - target
    - node
    - node_type
    - previous_exposure
    - exposure
    - verified
    properties:
      target:
        type: string
      node:
        type: string
      node_type:
        type: string
      previous_exposure:
        type: number
      exposure:
        type: number
        minimum: -20.0
        maximum: 20.0
      verified:
        type: boolean
        const: true
- name: set_render_quality
  description: Apply a render quality preset (low/medium/high) to the Maya defaultRenderQuality
    node.
  execution: sync
  affinity: main
  annotations:
    idempotent_hint: true
  group: rendering
  input_schema:
    type: object
    properties:
      preset:
        type: string
        enum:
        - low
        - medium
        - high
        default: medium
- name: set_render_settings
  description: Set render parameters (resolution, frame range, renderer, image format,
    output path).
  execution: sync
  affinity: main
  annotations:
    idempotent_hint: true
  group: rendering
  input_schema:
    type: object
    additionalProperties: false
    properties:
      width:
        type: integer
        minimum: 1
        maximum: 8192
        description: Render width in pixels.
      height:
        type: integer
        minimum: 1
        maximum: 8192
        description: Render height in pixels.
      start_frame:
        type: number
        minimum: -1000000
        maximum: 1000000
        description: Animation start frame.
      end_frame:
        type: number
        minimum: -1000000
        maximum: 1000000
        description: Animation end frame.
      renderer:
        type: string
        minLength: 1
        maxLength: 128
        description: Render engine name (e.g. mayaSoftware, arnold, vray).
      image_format:
        type: string
        enum:
        - gif
        - soft
        - rla
        - tiff
        - sgi
        - jpg
        - jpeg
        - eps
        - iff
        - png
        - maya16iff
        - exr
        - tga
        - bmp
        description: Image format (e.g. png, exr, jpg, tiff).
      output_path:
        type: string
        minLength: 1
        maxLength: 4096
        description: Output directory path for rendered images.
      aa_samples:
        type: integer
        minimum: 0
        maximum: 20
      diffuse_samples:
        type: integer
        minimum: 0
        maximum: 20
      specular_samples:
        type: integer
        minimum: 0
        maximum: 20
      transmission_samples:
        type: integer
        minimum: 0
        maximum: 20
      sss_samples:
        type: integer
        minimum: 0
        maximum: 20
      volume_samples:
        type: integer
        minimum: 0
        maximum: 20
  output_schema:
    type: object
    additionalProperties: false
    required:
    - verified
    properties:
      width:
        type: integer
        minimum: 1
        maximum: 8192
      height:
        type: integer
        minimum: 1
        maximum: 8192
      start_frame:
        type: number
      end_frame:
        type: number
      renderer:
        type: string
      image_format:
        type: string
      output_path:
        type: string
      aa_samples:
        type: integer
        minimum: 0
        maximum: 20
      diffuse_samples:
        type: integer
        minimum: 0
        maximum: 20
      specular_samples:
        type: integer
        minimum: 0
        maximum: 20
      transmission_samples:
        type: integer
        minimum: 0
        maximum: 20
      sss_samples:
        type: integer
        minimum: 0
        maximum: 20
      volume_samples:
        type: integer
        minimum: 0
        maximum: 20
      verified:
        type: boolean
        const: true
